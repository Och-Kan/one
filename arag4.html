/*Agentic RAG 实践
后端代码
*/
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>往返校车智能问答系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 800px;
            max-width: 95vw;
            height: 90vh;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: green;  /**主题色**/
            color: white;
            padding: 18px 24px;
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            text-align: center;
            gap: 10px;
        }
        .chat-header span {
            background: #ffc107;
            color: #2c3e66;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 40px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafcff;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }
        .user-message {
            align-self: flex-end;
        }
        .bot-message {
            align-self: flex-start;
        }
        .bubble {
            padding: 12px 18px;
            border-radius: 24px;
            line-height: 1.45;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .user-message .bubble {
            background: greenyellow; /**用户气泡色**/
            color: white;
            border-bottom-right-radius: 6px;
        }
        .bot-message .bubble {
            background: #e9ecef;
            color: rgb(0, 0, 0); /**文字颜色**/
            border-bottom-left-radius: 6px;
        }
        .input-area {
            display: flex;
            padding: 16px 20px 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }
        .input-area input:focus {
            border-color: green;
            box-shadow: 0 0 0 2px rgba(44,62,102,0.2);
        }
        .input-area button {
            background: green;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-area button:hover {
            background: green;
        }
        .thinking {
            font-size: 0.75rem;
            color: #bababa;
            margin-top: 6px;
            margin-left: 12px;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 8px;
            color: #8a99b0;
            background: white;
            border-top: 1px solid #eef2f6;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">往返校区实验实习活动用车安排查询</div>
    <div class="messages" id="messages">
        <div class="message bot-message">
            <div class="bubble"> 你好！我可以帮你查询往返校区实验活动的用车。<br>问题示例：周五下午从铜盘到旗山的校车有哪些班次？</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入你的问题..." autocomplete="off">
        <button id="sendBtn">发送</button>
    </div>
    <footer>目前仅支持第九周的数据。</footer>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // 调用后端 API
    async function sendMessageToBackend(userMessage) {
        const response = await fetch('http://localhost:5000/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMessage })
        });
        if (!response.ok) {
            throw new Error(`服务器错误 ${response.status}`);
        }
        const data = await response.json();
        return data.answer;
    }

    // 添加一条消息到界面
    function addMessage(role, text, thinkingText = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role === 'user' ? 'user-message' : 'bot-message'}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        messageDiv.appendChild(bubble);
        
        if (thinkingText && role === 'bot') {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking';
            thinkingDiv.innerText = thinkingText;
            messageDiv.appendChild(thinkingDiv);
        }
        
        messagesDiv.appendChild(messageDiv);
        // 滚动到底部
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 显示“正在输入”占位符
    let tempBotMessage = null;
    function showTyping() {
        if (tempBotMessage) tempBotMessage.remove();
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot-message';
        typingDiv.innerHTML = '<div class="bubble">正在查询...</div>';
        messagesDiv.appendChild(typingDiv);
        tempBotMessage = typingDiv;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    function hideTyping() {
        if (tempBotMessage) {
            tempBotMessage.remove();
            tempBotMessage = null;
        }
    }

    async function handleUserMessage() {
        const userText = userInput.value.trim();
        if (!userText) return;
        
        // 显示用户消息
        addMessage('user', userText);
        userInput.value = '';
        
        // 显示加载动画
        showTyping();
        
        try {
            const answer = await sendMessageToBackend(userText);
            hideTyping();
            // 如果你后端返回了 reasoning 字段，可以如下展示（需要后端配合）
            addMessage('bot', answer, '🧠 Agent 已提取关键信息并检索校车数据');
        } catch (error) {
            hideTyping();
            addMessage('bot', `❌ 抱歉，服务暂时不可用：${error.message}`, '请确保后端服务运行在 http://localhost:5000');
            console.error(error);
        }
    }

    sendBtn.addEventListener('click', handleUserMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleUserMessage();
    });
</script>
</body>
</html>
